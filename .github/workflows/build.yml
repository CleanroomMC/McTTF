name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Print version
        run: ./gradlew -q printVersion -Pversioning.run=${{ github.run_number }}

      - name: Build
        run: ./gradlew build -Pversioning.run=${{ github.run_number }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcttf
          path: |
            build/libs/
            build/distributions/
          if-no-files-found: error
