plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'com.cleanroommc.conventions'
}

description = 'Converts vanilla Minecraft bitmap fonts into pixel-perfect TrueType fonts'
base.archivesName = 'mcttf'

conventions {
    beginFrom = 2026
}

application {
    mainClass = 'com.cleanroommc.mcttf.cli.Main'
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'mcttf'
            from components.java
        }
    }
}
