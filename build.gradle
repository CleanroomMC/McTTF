plugins {
    id 'com.cleanroommc.versioning' version '2.0.0'
    id 'java-library'
    id 'application'
    id 'maven-publish'
}

group = providers.gradleProperty('group').get()
base.archivesName = 'mcttf'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

application {
    mainClass = 'com.cleanroommc.mcttf.cli.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Implementation-Version': version
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'mcttf'
            from components.java
            pom {
                name = 'McTTF'
                description = 'Converts vanilla Minecraft bitmap fonts into pixel-perfect TrueType fonts'
                url = 'https://github.com/CleanroomMC/McTTF'
            }
        }
    }
    repositories {
        maven {
            name = 'CleanroomMaven'
            url = 'https://maven.cleanroommc.com'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
